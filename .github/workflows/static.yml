name: Byg og udgiv siden
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'   # hver nat: hent jeres nyeste Bricks-opsætning til preview
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent Bricks-opsætning (CSS til preview) fra stocksite og templatesite
        run: python3 hent-bricks.py || echo "Kunne ikke hente – bruger src/bricks.json fra repoet"
      - run: python3 build.py
      - run: |
          mkdir _site
          cp index.html config.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
