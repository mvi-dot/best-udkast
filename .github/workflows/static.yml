name: Byg og udgiv siden
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'          # hver nat: hent jeres nyeste Bricks-opsætning og nye templates' CSS til preview
    - cron: '30 5-16 * * 1-5'    # og hver time i arbejdstiden (07.30–18.30 dansk tid), så nye templates hurtigt får den præcise CSS
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent Bricks-opsætning (CSS til preview) fra stocksite og templatesite
        run: python3 hent-bricks.py || echo "Kunne ikke hente – bruger src/bricks.json fra repoet"
      - run: python3 build.py
      - run: |
          mkdir _site
          cp index.html _site/
          echo "{\"v\":\"${GITHUB_SHA::12}\"}" > _site/version.json   # Apps Script beder om netop denne udgave, så ingen ser en gammel
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
